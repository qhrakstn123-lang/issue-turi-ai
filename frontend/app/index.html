<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이슈털이 쇼츠 플래너</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <form id="project-form" class="input-panel">
          <div class="panel-heading">
            <h1>이슈털이 쇼츠 플래너</h1>
            <span id="status-pill" class="status-pill">대기</span>
          </div>

          <label>
            주제
            <textarea id="topic" name="topic" rows="4" required>커뮤니티에서 반응이 갈린 카페 주문 사건</textarea>
          </label>

          <div class="field-grid">
            <label>
              타깃
              <input id="target_audience" name="target_audience" value="이슈 쇼츠 시청자" />
            </label>
            <label>
              톤
              <input id="tone" name="tone" value="빠르고 친근한 썰체" />
            </label>
            <label>
              스타일
              <select id="style_template_id" name="style_template_id">
                <option value="issue_turi_basic">이슈털이 기본형</option>
                <option value="issue_summary">이슈 요약형</option>
                <option value="controversy_roundup">논란 정리형</option>
              </select>
            </label>
            <label>
              길이
              <input id="video_length_seconds" name="video_length_seconds" type="number" min="40" max="60" value="50" />
            </label>
          </div>

          <button type="submit">생성</button>
        </form>

        <section class="result-panel">
          <div class="panel-heading">
            <h2 id="script-title">생성 결과</h2>
            <span id="safety-status" class="status-pill muted">검토 전</span>
          </div>
          <section id="result-summary" class="summary-grid" aria-label="생성 요약"></section>
          <section id="safety-review" class="safety-review" aria-label="안전 검토"></section>
          <ol id="scene-list" class="scene-list"></ol>
        </section>
      </section>
    </main>

    <template id="scene-template">
      <li class="scene-row">
        <div class="scene-meta">
          <strong class="scene-purpose"></strong>
          <span class="scene-duration"></span>
        </div>
        <div class="scene-sections">
          <section class="scene-section scene-script">
            <h3>Script</h3>
            <p class="scene-narration"></p>
          </section>

          <section class="scene-section scene-subtitle-block">
            <h3>Subtitle</h3>
            <div class="scene-tags">
              <span class="scene-subtitle"></span>
              <span class="scene-emphasis"></span>
            </div>
          </section>

          <section class="scene-section scene-visual">
            <h3>Visual</h3>
            <dl class="field-list">
              <div><dt>Type</dt><dd class="scene-visual-type"></dd></div>
              <div><dt>Description</dt><dd class="scene-visual-description"></dd></div>
              <div><dt>GIF/Clip</dt><dd class="scene-gif-suggestion"></dd></div>
            </dl>
            <div class="keyword-list scene-keywords"></div>
            <details class="prompt-details">
              <summary>Generated image prompt</summary>
              <pre class="scene-image-prompt"></pre>
            </details>
          </section>

          <section class="scene-section scene-sourcing">
            <h3>Sourcing</h3>
            <div class="scene-tags">
              <span class="scene-source-strategy"></span>
              <span class="scene-capture-source"></span>
              <span class="scene-capture-usage"></span>
            </div>
            <p class="asset-note"></p>
          </section>

          <section class="scene-section scene-editing">
            <h3>Editing</h3>
            <div class="scene-tags">
              <span class="scene-motion"></span>
              <span class="scene-sound"></span>
            </div>
            <p class="scene-notes"></p>
          </section>
        </div>
      </li>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
